<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t d">
  <title id="t">MediNAO system flow</title>
  <desc id="d">A visitor is seen by the camera and the expression model, the dialogue asks for a department, the Dijkstra planner routes over the floorplan weights and obstacles, and the motion layer walks the robot while speech answers the visitor.</desc>
  <style>
    .box{fill:#ffffff;stroke:#c9ced6;stroke-width:1.5}
    .box-a{fill:#f4f7ff;stroke:#9db4e8}
    .box-b{fill:#f7f7f8;stroke:#cfd3da}
    .t{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:#1d2129}
    .s{font:400 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:#5b6472}
    .m{font:400 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#7a8494}
    .a{stroke:#8d99ab;stroke-width:1.5;fill:none;marker-end:url(#ah)}
    .label{font:400 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:#6b7480}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8d99ab"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="400" fill="#fbfcfd"/>

  <rect class="box box-a" x="24" y="150" width="150" height="76" rx="10"/>
  <text class="t" x="40" y="178">Visitor</text>
  <text class="s" x="40" y="196">speech + face</text>
  <text class="m" x="40" y="214">camera_client.py</text>

  <rect class="box" x="212" y="52" width="206" height="88" rx="10"/>
  <text class="t" x="228" y="78">Expression</text>
  <text class="s" x="228" y="96">Keras CNN → label</text>
  <text class="m" x="228" y="114">FacialExpressionDetection.py</text>

  <rect class="box" x="212" y="182" width="206" height="96" rx="10"/>
  <text class="t" x="228" y="208">Dialogue</text>
  <text class="s" x="228" y="226">department vocabulary</text>
  <text class="s" x="228" y="242">speech in / speech out</text>
  <text class="m" x="228" y="262">HRI_Speech_EmoRec_Interaction.py</text>

  <rect class="box box-a" x="462" y="182" width="200" height="96" rx="10"/>
  <text class="t" x="478" y="208">Route planner</text>
  <text class="s" x="478" y="226">Dijkstra over 8×8 weights</text>
  <text class="s" x="478" y="242">obstacles inflate cell cost</text>
  <text class="m" x="478" y="262">Path_Calculation.py</text>

  <rect class="box" x="706" y="182" width="196" height="96" rx="10"/>
  <text class="t" x="722" y="208">Motion</text>
  <text class="s" x="722" y="226">grid moves → walk commands</text>
  <text class="s" x="722" y="242">route drawing</text>
  <text class="m" x="722" y="262">Motion.py · Navigation.py</text>

  <rect class="box box-b" x="462" y="52" width="200" height="88" rx="10"/>
  <text class="t" x="478" y="78">Floorplan editor</text>
  <text class="s" x="478" y="96">cell weights, start, goal</text>
  <text class="m" x="478" y="114">GUI.py</text>

  <rect class="box box-b" x="706" y="52" width="196" height="88" rx="10"/>
  <text class="t" x="722" y="78">Obstacles</text>
  <text class="s" x="722" y="96">people and furniture</text>
  <text class="m" x="722" y="114">Obstacle.py</text>

  <rect class="box box-a" x="462" y="320" width="200" height="56" rx="10"/>
  <text class="t" x="478" y="345">NAO V6 · NAOqi 2.5</text>
  <text class="m" x="478" y="363">Main.py wires the modules</text>

  <path class="a" d="M174 172 L204 118"/>
  <text class="label" x="150" y="126">frames</text>

  <path class="a" d="M174 198 L204 214"/>
  <text class="label" x="176" y="244">speech</text>

  <path class="a" d="M315 140 L315 174"/>
  <text class="label" x="322" y="166">emotion</text>

  <path class="a" d="M418 230 L454 230"/>
  <text class="label" x="396" y="220">destination</text>

  <path class="a" d="M662 230 L698 230"/>
  <text class="label" x="664" y="222">route</text>

  <path class="a" d="M562 140 L562 174"/>
  <text class="label" x="569" y="166">weights</text>

  <path class="a" d="M704 96 L670 96"/>
  <text class="label" x="676" y="88">cost</text>

  <path class="a" d="M804 278 L804 348 L670 348"/>
  <text class="label" x="690" y="340">commands</text>

  <text class="label" x="24" y="392">The planner and the obstacle model are plain Python and are covered by the tests in tests/. Everything that talks to NAOqi needs the robot.</text>
</svg>
